name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/server/**"
      - "apps/cli/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/server-ci.yaml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/server/**"
      - "apps/cli/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/server-ci.yaml"

permissions:
  contents: read

jobs:
  check:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # apps/web vendors npm packages that ship Go files; ./... would walk in.
      - name: Resolve the Go packages
        id: pkgs
        run: echo "list=$(go list ./... | grep -v /node_modules/ | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - run: go build ${{ steps.pkgs.outputs.list }}
      - run: go vet ${{ steps.pkgs.outputs.list }}

      # Layer boundaries live here, not in a review comment (backend ADR 0001).
      - run: go tool golangci-lint run ./apps/... ./internal/...

      - run: go test ${{ steps.pkgs.outputs.list }}
