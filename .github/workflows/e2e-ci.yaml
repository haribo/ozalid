name: End to end

# The suite that watches the whole chain: a real browser, a real server, a real
# database, real PNG bytes.
#
# Its own workflow rather than a job inside the web one, because it fails for
# different reasons and takes different time. A failure here means the parts
# stopped agreeing, which is a different message from "the client does not
# typecheck".
#
# The path filter names every side of the chain: a change to the server can
# break the client without touching a line of it, which is the whole reason
# this suite exists.

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "internal/**"
      - "justfile"
      - "docker-compose.yaml"
      - ".github/workflows/e2e-ci.yaml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "internal/**"
      - "justfile"
      - "docker-compose.yaml"
      - ".github/workflows/e2e-ci.yaml"

permissions:
  contents: read

jobs:
  end-to-end:
    name: The whole chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the client
        run: npm ci
        working-directory: apps/web

      # Only the browser the suite runs, and its system libraries.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0

      - name: Run the suite
        run: just fe-test-e2e

      # What a failure needs to be understood: the trace of the run that broke,
      # and the screenshot of the moment it did.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
