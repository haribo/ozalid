<!doctype html>
<!-- ozalid-client-not-built -->
<!--
  A stand-in, committed so that `go build` works in a checkout where the client
  was never built. The image build replaces this whole directory with the real
  `apps/web/dist`.

  Seeing this page in a browser means the binary was built without the client:
  `just fe-build`, then build again — or use the image, which does both.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ozalid — client not built</title>
  </head>
  <body>
    <h1>The web client was not built into this binary.</h1>
    <p>The API is running: <a href="/api/health">/api/health</a>.</p>
  </body>
</html>
