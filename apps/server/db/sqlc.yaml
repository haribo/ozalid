# SQL is the source, Go is generated -- the same philosophy as the OpenAPI
# document (backend ADR 0003). A query that drifts from the schema fails here,
# not at runtime.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: sqlcgen
        out: ../internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
