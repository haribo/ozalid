openapi: 3.1.0
info:
  title: ozalid
  version: 0.1.0
  description: A hosted review book for end-to-end test evidence.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the service is able to serve
      tags:
        - service
      responses:
        '200':
          description: The service is serving.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  version:
                    type: string
                    description: The build this instance runs.
                    examples:
                      - 0.1.0
  /sign-in:
    post:
      operationId: requestSignIn
      summary: Ask for a sign-in link
      description: |
        Sends a link to the address, good once and for a few minutes.

        **The answer is the same whether the address is known or not.** Whether
        somebody has an account here is not something a stranger gets to learn by
        asking.
      tags:
        - sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: If that address has an account, a link is on its way.
        '400':
          $ref: '#/components/responses/BadRequest'
  /sign-in/claim:
    post:
      operationId: claimSignIn
      summary: Spend a sign-in link and open a session
      description: |
        The session is set as an `HttpOnly` cookie, so no script can read it.

        Expired, already spent and never issued are one answer: the browser is told
        the link no longer works, and learns nothing about which of the three it
        was.
      tags:
        - sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link
              properties:
                link:
                  type: string
      responses:
        '204':
          description: Signed in. The session is in the response's cookie.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /sign-out:
    post:
      operationId: signOut
      summary: End this session
      description: |
        This browser's session, and no other. Signing out here does not sign out
        elsewhere.
      tags:
        - sign-in
      responses:
        '204':
          description: Signed out, or was not signed in — the same answer.
  /me:
    get:
      operationId: whoAmI
      security:
        - session: []
      summary: Who this request resolves to
      description: |
        What the client needs to know whether to show a review or a sign-in form.
      tags:
        - sign-in
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - email
                  - isAdmin
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  isAdmin:
                    type: boolean
                    description: Manages accounts and creates projects; reaches no content.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /projects/{slug}/blobs/{hash}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        description: The content address, as `sha256:` followed by 64 lowercase hex characters.
        schema:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        examples:
          capture:
            value: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    head:
      operationId: headBlob
      security:
        - serviceToken: []
        - session: []
      summary: Report whether the store already holds this content
      description: |
        Intake calls this before sending bytes: content already held is never
        uploaded again, which is what makes a full visual history affordable.

        Answered for the project the caller is pushing to. The store itself is
        shared across projects — identical bytes are held once
        ([ADR 0004](https://github.com/haribo/ozalid/blob/develop/docs/adr/0004-content-addressed-capture-storage.md)) —
        so this says what intake needs to know and nothing about who else holds it.
      tags:
        - blobs
      responses:
        '200':
          description: The store holds this content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The store does not hold this content.
    put:
      operationId: putBlob
      security:
        - serviceToken: []
        - session: []
      summary: Store content under its address
      description: |
        Idempotent: storing content that is already held changes nothing. The bytes
        are refused if they do not produce the announced address — content sitting
        at an address that does not describe it would hand every future reader the
        wrong evidence with no way to notice.

        When the address is already held the upload is answered `204` without the
        body being read at all, so a client sending the wrong bytes under a known
        address is not told. The stored content is still correct; verifying would
        mean reading every upload in full, which is the cost this avoids. Call
        `HEAD` first and skip what is already held.
      tags:
        - blobs
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The content is stored.
        '204':
          description: The store already held this content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The bytes do not produce the announced address.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
  /accounts:
    get:
      operationId: listAccounts
      security:
        - serviceToken: []
        - session: []
      summary: Every account on this instance
      description: |
        Deactivated accounts are listed too, and say so. They are what a name in the
        journal resolves to, so hiding them would leave a reviewer's name pointing
        at nothing.
      tags:
        - accounts
      responses:
        '200':
          description: The accounts, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAccount
      security:
        - serviceToken: []
        - session: []
      summary: Make an account for a person
      description: |
        There is no open sign-up: an account exists because an administrator made it
        (`product.md` §8.2). No password is stored — the address is how they sign
        in, so there is nothing to forget and nothing to reset
        ([ADR 0019](https://github.com/haribo/ozalid/blob/develop/docs/adr/0019-two-kinds-of-account-one-set-of-rights.md)).

        The new account reaches nothing until somebody grants it a membership.
      tags:
        - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That address already has an account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
  /accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deactivateAccount
      security:
        - serviceToken: []
        - session: []
      summary: Stop an account from signing in
      description: |
        Deactivated, never deleted. Every fact it recorded keeps naming it, and the
        journal holds no foreign key to the account table precisely so evidence
        outlives the person ([ADR 0018](https://github.com/haribo/ozalid/blob/develop/docs/adr/0018-an-actor-is-never-invented.md)).

        Idempotent: deactivating an account that is already deactivated changes
        nothing and answers the same.
      tags:
        - accounts
      responses:
        '204':
          description: The account can no longer sign in.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    post:
      operationId: createProject
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Open a book
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        '201':
          description: The project is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That slug is taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
  /projects/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read a project
      tags:
        - projects
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/axes:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listAxes
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read the project's rendering axes, in their declared order
      tags:
        - projects
      responses:
        '200':
          description: The axes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Axis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: orderAxes
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Declare the order the axes read in
      description: |
        Only the order. Axes themselves are created by first use at intake —
        ozalid ships no list of them and never invents one.

        The order is what a variant's label reads from: placing `viewport` before
        `theme` turns `dark·desktop` into `desktop·dark`. Existing variants are
        relabelled, since a label is a rendering of the values and never an
        identity.

        An axis the project omits keeps its place after those it named.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  type: array
                  description: Axis names, most significant first.
                  items:
                    type: string
                  examples:
                    - - viewport
                      - theme
                      - locale
      responses:
        '200':
          description: The axes in their new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Axis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/cases:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listCases
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: List the catalogue
      description: |
        Filters on the stored state, without scanning — which is why the state is
        stored at all. Archived cases are never listed.
      tags:
        - cases
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/CaseState'
        - name: categoryId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The cases.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCase
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Open a case and receive its id
      description: |
        The id comes back generated; the client stores it and sends it on every
        subsequent edition. It never invents one.
      tags:
        - cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCase'
      responses:
        '201':
          description: The case is open, outside the funnel until it has captures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/editions:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createEdition
      security:
        - serviceToken: []
        - session: []
      summary: Take a run's evidence into the book
      description: |
        Push the complete manifest. Ask `HEAD /blobs/{hash}` first and upload what
        the store does not hold — a manifest referencing absent content is refused
        with the list of addresses to send.

        The edition is written in one transaction: it exists whole, or not at all.
        There is no pending edition.
      tags:
        - editions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manifest'
      responses:
        '201':
          description: The edition is in the book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The manifest cannot be taken in: content is missing, a case is unknown
            or named twice, or the project runs `strict` and a review is open.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IntakeRefused'
  /projects/{slug}/categories:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listCategories
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read the catalogue tree
      tags:
        - categories
      responses:
        '200':
          description: The tree, parents before children.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCategory
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Add a node to the tree
      tags:
        - categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: The category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A sibling already carries that name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
  /projects/{slug}/captures/{captureId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: captureId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCaptureImage
      security:
        - serviceToken: []
        - session: []
      summary: The image a capture holds
      description: |
        Read through the capture, never through the content address. A hash names
        no project — identical bytes are stored once for every project that
        references them
        ([ADR 0004](https://github.com/haribo/ozalid/blob/develop/docs/adr/0004-content-addressed-capture-storage.md)) —
        so there is nothing there to check a membership against. A capture has a
        row, a case and therefore one project (`product.md` §8.1).

        The response is immutable: a capture's bytes never change, because a new
        run produces a new capture rather than overwriting one.
      tags:
        - blobs
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/recordings/{recordingId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRecordingVideo
      security:
        - serviceToken: []
        - session: []
      summary: The video a recording holds
      description: |
        Read through the recording, for the same reason a capture's image is
        (`product.md` §8.1). A recording is a supporting exhibit: never
        byte-compared, never a source of state (ADR 0013).
      tags:
        - blobs
      responses:
        '200':
          description: The video.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/cases/{caseId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCase
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read a case, archived or not
      tags:
        - cases
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCase
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Change what is mutable about a case
      description: Its id and its state are not part of that.
      tags:
        - cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdate'
      responses:
        '200':
          description: The updated case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/cases/{caseId}/captures:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCaseCaptures
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read the evidence a case is judged from
      description: |
        The grid: steps in order, the variants that exist, and the capture sitting
        at each cell. A cell with no capture is simply absent — not every variant
        exists at every step.

        Defaults to the project's most recent edition. A specific one can be asked
        for, since a case may sit on an older edition while it is being reviewed.

        A case that has never been captured answers with an empty grid, not an
        error: not being instrumented is a legitimate state.
      tags:
        - cases
      parameters:
        - name: editionId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/cases/{caseId}/comments:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listComments
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Read what has been said about a case
      description: |
        Settled comments included. Nothing is deleted, and a discarded one stays
        visible with its reason and its author — "I reported this three months ago,
        who removed it?" must always have an answer (ADR 0006).
      tags:
        - comments
      responses:
        '200':
          description: The comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/comments/{commentId}/reference:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/CommentId'
    post:
      operationId: trackComment
      security:
        - serviceToken: []
        - session: []
      summary: Attach an external issue to a comment
      description: |
        The identifier, the URL and the title are **supplied by the client**.
        ozalid never fetches them, never refreshes them, and will never know the
        issue was closed — it holds no tracker credential and wants none
        (ADR 0003).
      tags:
        - comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRef'
      responses:
        '200':
          $ref: '#/components/responses/MoveApplied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveRefused'
  /projects/{slug}/comments/{commentId}/discard:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/CommentId'
    post:
      operationId: discardComment
      security:
        - serviceToken: []
        - session: []
      summary: Set a comment aside
      description: |
        The reason is mandatory, and kept forever with its author. The friction is
        intended: a defect dismissed without a reason is exactly what comes back
        in six months. Nothing is deleted — a discarded comment stays visible on
        its case (ADR 0006).
      tags:
        - comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/MoveApplied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveRefused'
  /projects/{slug}/comments/{commentId}/delivery:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/CommentId'
    post:
      operationId: deliverComment
      security:
        - serviceToken: []
        - session: []
      summary: Ask for a judgment on a delivered fix
      description: |
        The dev saying "I finished this, look". Only they know it — captures also
        move for a refactor or a dependency bump, and summoning the reviewer for
        that is noise.

        They may ask without having implemented everything else on the case: one
        issue can depend on the verdict given on another.
      tags:
        - comments
      responses:
        '200':
          $ref: '#/components/responses/MoveApplied'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveRefused'
  /projects/{slug}/comments/{commentId}/judgment:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/CommentId'
    post:
      operationId: judgeComment
      security:
        - serviceToken: []
        - session: []
      summary: Accept a delivery, or refuse it
      description: |
        A refusal carries a mandatory remark and is **not** a way to die: the dev
        reworks and delivers again, as many rounds as it takes. Every judgment is
        kept, so three round trips on one comment stay visible.
      tags:
        - comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accept
              properties:
                accept:
                  type: boolean
                remark:
                  type: string
                  description: Mandatory when refusing. It is what the dev has to read.
      responses:
        '200':
          $ref: '#/components/responses/MoveApplied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveRefused'
  /projects/{slug}/cases/{caseId}/reviews:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: saveReview
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Save what one review session decided
      description: |
        One save carries everything the sitting produced: the squares looked at with
        nothing to say, and the comments written on the rest. Splitting it would
        leave a case half-judged between two calls.

        The server works out what it means. **No endpoint accepts a case state** —
        it is computed from the comments and the verdicts, never received
        (ADR 0002, ADR 0012).
      tags:
        - reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSave'
      responses:
        '200':
          description: What the session amounted to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{slug}/cases/{caseId}/archive:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: archiveCase
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Take a case out of the catalogue
      description: |
        It stops being listed and stops blocking intake, and stays readable with its
        captures, comments and journal. There is no deletion.
      tags:
        - cases
      responses:
        '204':
          description: The case is archived.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The case was already archived.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
  /projects/{slug}/categories/{categoryId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteCategory
      security:
        - serviceToken: []
        - session: []
        - session: []
      summary: Remove an empty node
      description: |
        Only an empty one. Deleting a filing drawer must not silently move what was
        inside it, so a category holding a sub-category or a case is refused.

        An **archived** case counts as content: it still records where it was filed,
        and an archived case is meant to stay whole. Move it first if the category
        has to go.
      tags:
        - categories
      responses:
        '204':
          description: The category is gone.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The category is not empty.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ozalid_session
      description: |
        The cookie a sign-in opens. `HttpOnly`, so no script reads it; the
        browser sends it on its own, which is what lets an `<img>` fetch a
        capture.
    serviceToken:
      type: http
      scheme: bearer
      description: |
        A service account's token, minted once and shown once
        ([ADR 0019](https://github.com/haribo/ozalid/blob/develop/docs/adr/0019-two-kinds-of-account-one-set-of-rights.md)).

        It belongs to exactly one project: a token naming project A cannot push
        to project B, and the attempt is refused rather than ignored.
  schemas:
    Problem:
      $ref: '#/components/schemas/problem'
    problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type.
          examples:
            - https://ozalid.dev/problems/case-not-found
        title:
          type: string
          description: A short, human-readable summary, stable for a given type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: An explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
    Account:
      type: object
      required:
        - id
        - name
        - email
        - isAdmin
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Manages accounts and creates projects; reaches no content.
        deactivatedAt:
          type: string
          format: date-time
          description: |
            Absent while the account works. An account is deactivated, never
            deleted: what it reviewed stays readable and the journal keeps naming
            it (ADR 0018).
        createdAt:
          type: string
          format: date-time
    NewAccount:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: Unique, and where the sign-in link is sent. There is no password.
        isAdmin:
          type: boolean
          default: false
    NewProject:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        name:
          type: string
          minLength: 1
        intakePolicy:
          type: string
          enum:
            - strict
            - per-case
          default: per-case
    Project:
      type: object
      required:
        - id
        - slug
        - name
        - intakePolicy
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        intakePolicy:
          type: string
          enum:
            - strict
            - per-case
          description: |
            `strict` refuses intake while any case is to-review; `per-case` never
            refuses.
        createdAt:
          type: string
          format: date-time
    Axis:
      type: object
      required:
        - name
        - position
      description: |
        A rendering dimension the project declares. ozalid ships no built-in list:
        an axis exists because a capture mentioned it.
      properties:
        name:
          type: string
        position:
          type: integer
          description: Where it reads in a variant's label. Lower comes first.
    CaseState:
      type: string
      enum:
        - not-instrumented
        - to-review
        - to-fix
        - reviewed
      description: |
        Who holds the ball. Computed by the server from the case's comments; no
        endpoint accepts it as an argument.
    CaptureCounts:
      type: object
      required:
        - total
        - validated
        - commented
        - toJudge
      description: |
        How this case's captures stand at the edition it points at. A capture with
        no verdict yet counts as still to judge.
      properties:
        total:
          type: integer
        validated:
          type: integer
        commented:
          type: integer
        toJudge:
          type: integer
    Case:
      type: object
      required:
        - id
        - projectId
        - title
        - state
        - archived
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Generated by the server when the case was created. Stable forever.
        projectId:
          type: string
        categoryId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/CaseState'
        archived:
          type: boolean
          description: An archived case leaves the catalogue but stays readable.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        captures:
          $ref: '#/components/schemas/CaptureCounts'
        lastEdition:
          type: string
          format: date-time
          nullable: true
    NewCase:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: string
    Variant:
      type: object
      additionalProperties:
        type: string
      description: |
        A combination of axis values, such as `{"theme":"dark","viewport":"mobile"}`.
        The project declares its own axes — ozalid ships no list. An axis the client
        does not supply is simply absent: a site with no theme has no theme.
      examples:
        - theme: dark
          viewport: mobile
          locale: fr
        - locale: en
    Provenance:
      type: object
      description: |
        Where the capture was produced. Byte comparison only means something within
        one environment, so this is recorded and never guessed.
      properties:
        os:
          type: string
        browser:
          type: string
        browserVersion:
          type: string
        resolution:
          type: string
          description: The effective resolution, recorded as provenance and never as identity.
        environmentId:
          type: string
    ManifestCapture:
      type: object
      required:
        - variant
        - hash
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
        hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        provenance:
          $ref: '#/components/schemas/Provenance'
    ManifestStep:
      type: object
      required:
        - name
        - captures
      properties:
        name:
          type: string
          minLength: 1
        captures:
          type: array
          items:
            $ref: '#/components/schemas/ManifestCapture'
    ManifestRecording:
      type: object
      required:
        - variant
        - hash
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
        hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    ManifestCase:
      type: object
      required:
        - id
        - steps
      properties:
        id:
          type: string
          description: The id ozalid generated when the case was created.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ManifestStep'
        recordings:
          type: array
          description: The flow video per variant. Optional, and never compared byte-wise.
          items:
            $ref: '#/components/schemas/ManifestRecording'
    Manifest:
      type: object
      required:
        - cases
      properties:
        revision:
          type: string
          description: |
            Opaque to ozalid: displayed, never computed on. A commit hash, a build
            number — whatever the client means by "which version produced this".
        cases:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ManifestCase'
    EditionAccepted:
      type: object
      required:
        - editionId
        - cases
        - captures
        - recordings
      properties:
        editionId:
          type: string
        cases:
          type: integer
        captures:
          type: integer
        recordings:
          type: integer
    IntakeRefused:
      allOf:
        - $ref: '#/components/schemas/problem'
        - type: object
          properties:
            missingContent:
              type: array
              description: The addresses to upload before pushing again.
              items:
                type: string
            notAPng:
              type: array
              description: |
                The addresses of captures that are not PNG. A separate field from
                `missingContent` on purpose: the store holds these bytes, so
                uploading them again would fix nothing. They have to be re-captured.
              items:
                type: string
    StateCounts:
      type: object
      required:
        - notInstrumented
        - toReview
        - toFix
        - reviewed
      description: |
        How many cases sit in each state under this node, across its **whole
        descendance** — not just its direct children. A branch in trouble has to be
        visible from the root.
      properties:
        notInstrumented:
          type: integer
        toReview:
          type: integer
        toFix:
          type: integer
        reviewed:
          type: integer
    Category:
      type: object
      required:
        - id
        - name
        - position
        - cases
      properties:
        id:
          type: string
        parentId:
          type: string
          nullable: true
        name:
          type: string
        position:
          type: integer
        cases:
          $ref: '#/components/schemas/StateCounts'
        lastActivity:
          type: string
          format: date-time
          nullable: true
    NewCategory:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type: string
        position:
          type: integer
          default: 0
    CaseUpdate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
    GridVariant:
      type: object
      required:
        - id
        - label
        - values
      properties:
        id:
          type: string
        label:
          type: string
          description: A readable rendering of the combination, such as `dark·mobile`.
        values:
          type: object
          additionalProperties:
            type: string
    GridCell:
      type: object
      required:
        - id
        - variantId
        - hash
        - status
      properties:
        id:
          type: string
          description: |
            The capture. Fetch its image at
            `/projects/{slug}/captures/{captureId}` — the hash names no project and
            cannot be authorised (`product.md` §8.1).
        variantId:
          type: string
        hash:
          type: string
          description: |
            The content address these bytes are stored under. What a client
            computes before uploading, not what a reader fetches with.
        status:
          type: string
          enum:
            - to-review
            - to-fix
            - validated
          description: |
            Where this square stands. Computed by the server from the comments
            covering it — never set by a caller (ADR 0012).
        freshness:
          type: string
          enum:
            - current
            - to-re-review
          description: |
            Whether this capture still shows what a reviewer approved, computed once
            when it arrived. **Absent means nothing to compare against** — nobody has
            approved this square in this capture's environment — which is not the
            same as unchanged (ADR 0017).

            Freshness is an overlay, never a state: a `reviewed` case whose captures
            move stays `reviewed` until its reviewer says otherwise.
        movedPixels:
          type: integer
          minimum: 0
          description: |
            How many pixels differed by more than the fixed per-channel tolerance.
            Recorded so a project can judge its threshold rather than guess it.

            Absent when no pixel reading happened: identical addresses need none, and
            images of different dimensions admit none.
        provenance:
          $ref: '#/components/schemas/Provenance'
    GridStep:
      type: object
      required:
        - id
        - name
        - position
        - cells
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
        cells:
          type: array
          description: One entry per variant that has a capture at this step.
          items:
            $ref: '#/components/schemas/GridCell'
    GridRecording:
      type: object
      required:
        - id
        - variantId
        - hash
      properties:
        id:
          type: string
          description: Fetch the video at `/projects/{slug}/recordings/{recordingId}`.
        variantId:
          type: string
        hash:
          type: string
    Grid:
      type: object
      required:
        - caseId
        - variants
        - steps
        - recordings
      properties:
        caseId:
          type: string
        editionId:
          type: string
          description: Absent when the project has taken nothing in yet.
        revision:
          type: string
          description: |
            What the client declared this edition was built from. Displayed, never
            computed on.
        takenAt:
          type: string
          format: date-time
        variants:
          type: array
          description: The variants present in this edition, in label order.
          items:
            $ref: '#/components/schemas/GridVariant'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GridStep'
        recordings:
          type: array
          items:
            $ref: '#/components/schemas/GridRecording'
    CommentState:
      type: string
      enum:
        - to-track
        - tracked
        - to-review
        - refused
        - validated
        - discarded
      description: |
        Where the comment stands. `validated` and `discarded` are the only terminal
        states; a refusal returns to `to-review` on the next delivery.
    IssueRef:
      type: object
      required:
        - id
      description: |
        An opaque reference to an issue somewhere else. Supplied by the client and
        never read back: ozalid holds no tracker credential (ADR 0003).
      properties:
        id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        title:
          type: string
          description: |
            Shown next to the comment. ozalid never refreshes it, so it is whatever
            the client said at the time.
    Judgment:
      type: object
      required:
        - verdict
        - actorId
        - at
      properties:
        verdict:
          type: string
          enum:
            - accepted
            - refused
        remark:
          type: string
          description: Mandatory on a refusal. It is what the dev has to read.
        actorId:
          type: string
        at:
          type: string
          format: date-time
    Comment:
      type: object
      required:
        - id
        - stepId
        - kind
        - body
        - state
        - variantIds
        - authorId
        - createdAt
        - judgments
      properties:
        id:
          type: string
        stepId:
          type: string
        kind:
          type: string
          enum:
            - defect
            - improvement
        body:
          type: string
          description: What the reviewer wrote, in their words. It survives the issue title.
        state:
          $ref: '#/components/schemas/CommentState'
        variantIds:
          type: array
          items:
            type: string
        issue:
          $ref: '#/components/schemas/IssueRef'
        discardReason:
          type: string
          description: Mandatory when discarded, and kept forever with its author.
        authorId:
          type: string
        createdAt:
          type: string
          format: date-time
        judgments:
          type: array
          description: Every judgment, not just the last — three round trips is information.
          items:
            $ref: '#/components/schemas/Judgment'
    MoveOutcome:
      type: object
      required:
        - commentState
        - caseState
      properties:
        commentState:
          $ref: '#/components/schemas/CommentState'
        caseState:
          $ref: '#/components/schemas/CaseState'
    CellRef:
      type: object
      required:
        - stepId
        - variantId
      properties:
        stepId:
          type: string
        variantId:
          type: string
    NewComment:
      type: object
      required:
        - stepId
        - kind
        - body
        - variantIds
      properties:
        stepId:
          type: string
        kind:
          type: string
          enum:
            - defect
            - improvement
          description: |
            What it is. The kind is written on the comment, where it is exact and
            where the issue is written from — it never colours the case's state.
        body:
          type: string
          minLength: 1
        variantIds:
          type: array
          minItems: 1
          description: |
            The variants it applies to. One defect spanning four variants is **one**
            comment with four variants checked, never four comments.
          items:
            type: string
    ReviewSave:
      type: object
      properties:
        validated:
          type: array
          description: The squares the reviewer looked at with nothing to say.
          items:
            $ref: '#/components/schemas/CellRef'
        comments:
          type: array
          description: What the reviewer wrote during the sitting.
          items:
            $ref: '#/components/schemas/NewComment'
    CellVerdict:
      allOf:
        - $ref: '#/components/schemas/CellRef'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - to-review
                - to-fix
                - validated
    ReviewOutcome:
      type: object
      required:
        - state
        - comments
        - verdicts
      properties:
        state:
          $ref: '#/components/schemas/CaseState'
        comments:
          type: integer
          description: How many comments the session added.
        verdicts:
          type: array
          description: The status of every capture the case has, after the save.
          items:
            $ref: '#/components/schemas/CellVerdict'
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
    Unauthenticated:
      description: The caller presented no usable credential.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
    Forbidden:
      description: The caller is known and not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
    MoveApplied:
      description: Where the comment and its case now stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoveOutcome'
    MoveRefused:
      description: |
        The move does not exist from where the comment stands, or it is already
        settled.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
