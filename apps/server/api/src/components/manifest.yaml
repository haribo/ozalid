Manifest:
  type: object
  required: [cases]
  properties:
    revision:
      type: string
      description: |
        Opaque to ozalid: displayed, never computed on. A commit hash, a build
        number — whatever the client means by "which version produced this".
    cases:
      type: array
      minItems: 1
      items:
        $ref: "#/ManifestCase"

ManifestCase:
  type: object
  required: [id, steps]
  properties:
    id:
      type: string
      description: The id ozalid generated when the case was created.
    steps:
      type: array
      items:
        $ref: "#/ManifestStep"
    recordings:
      type: array
      description: The flow video per variant. Optional, and never compared byte-wise.
      items:
        $ref: "#/ManifestRecording"

ManifestStep:
  type: object
  required: [name, captures]
  properties:
    name: { type: string, minLength: 1 }
    captures:
      type: array
      items:
        $ref: "#/ManifestCapture"

ManifestCapture:
  type: object
  required: [variant, hash]
  properties:
    variant:
      $ref: "#/Variant"
    hash:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    provenance:
      $ref: "#/Provenance"

ManifestRecording:
  type: object
  required: [variant, hash]
  properties:
    variant:
      $ref: "#/Variant"
    hash:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

Variant:
  type: object
  additionalProperties:
    type: string
  description: |
    A combination of axis values, such as `{"theme":"dark","viewport":"mobile"}`.
    The project declares its own axes — ozalid ships no list. An axis the client
    does not supply is simply absent: a site with no theme has no theme.
  examples:
    - { theme: dark, viewport: mobile, locale: fr }
    - { locale: en }

Provenance:
  type: object
  description: |
    Where the capture was produced. Byte comparison only means something within
    one environment, so this is recorded and never guessed.
  properties:
    os: { type: string }
    browser: { type: string }
    browserVersion: { type: string }
    resolution:
      type: string
      description: The effective resolution, recorded as provenance and never as identity.
    environmentId: { type: string }

EditionAccepted:
  type: object
  required: [editionId, cases, captures, recordings]
  properties:
    editionId: { type: string }
    cases: { type: integer }
    captures: { type: integer }
    recordings: { type: integer }

IntakeRefused:
  allOf:
    - $ref: "./problem.yaml"
    - type: object
      properties:
        missingContent:
          type: array
          description: The addresses to upload before pushing again.
          items: { type: string }
        notAPng:
          type: array
          description: |
            The addresses of captures that are not PNG. A separate field from
            `missingContent` on purpose: the store holds these bytes, so
            uploading them again would fix nothing. They have to be re-captured.
          items: { type: string }
