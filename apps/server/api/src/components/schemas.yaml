Project:
  type: object
  required: [id, slug, name, intakePolicy, createdAt]
  properties:
    id: { type: string }
    slug: { type: string }
    name: { type: string }
    intakePolicy:
      type: string
      enum: [strict, per-case]
      description: |
        `strict` refuses intake while any case is to-review; `per-case` never
        refuses.
    createdAt: { type: string, format: date-time }

NewProject:
  type: object
  required: [slug, name]
  properties:
    slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    name: { type: string, minLength: 1 }
    intakePolicy:
      type: string
      enum: [strict, per-case]
      default: per-case

CaseState:
  type: string
  enum: [not-instrumented, to-review, to-fix, reviewed]
  description: |
    Who holds the ball. Computed by the server from the case's comments; no
    endpoint accepts it as an argument.

Case:
  type: object
  required: [id, projectId, title, state, archived, createdAt, updatedAt]
  properties:
    id:
      type: string
      description: Generated by the server when the case was created. Stable forever.
    projectId: { type: string }
    categoryId: { type: string, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    state:
      $ref: "#/CaseState"
    archived:
      type: boolean
      description: An archived case leaves the catalogue but stays readable.
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
    captures:
      $ref: "#/CaptureCounts"
    lastEdition:
      type: string
      format: date-time
      nullable: true

NewCase:
  type: object
  required: [title]
  properties:
    title: { type: string, minLength: 1 }
    description: { type: string }
    categoryId: { type: string }

CaseUpdate:
  type: object
  required: [title]
  properties:
    title: { type: string, minLength: 1 }
    description: { type: string, nullable: true }
    categoryId: { type: string, nullable: true }

Category:
  type: object
  required: [id, name, position, cases]
  properties:
    id: { type: string }
    parentId: { type: string, nullable: true }
    name: { type: string }
    position: { type: integer }
    cases:
      $ref: "#/StateCounts"
    lastActivity:
      type: string
      format: date-time
      nullable: true

StateCounts:
  type: object
  required: [notInstrumented, toReview, toFix, reviewed]
  description: |
    How many cases sit in each state under this node, across its **whole
    descendance** — not just its direct children. A branch in trouble has to be
    visible from the root.
  properties:
    notInstrumented: { type: integer }
    toReview: { type: integer }
    toFix: { type: integer }
    reviewed: { type: integer }

CaptureCounts:
  type: object
  required: [total, validated, commented, toJudge]
  description: |
    How this case's captures stand at the edition it points at. A capture with
    no verdict yet counts as still to judge.
  properties:
    total: { type: integer }
    validated: { type: integer }
    commented: { type: integer }
    toJudge: { type: integer }

NewCategory:
  type: object
  required: [name]
  properties:
    name: { type: string, minLength: 1 }
    parentId: { type: string }
    position: { type: integer, default: 0 }

Axis:
  type: object
  required: [name, position]
  description: |
    A rendering dimension the project declares. ozalid ships no built-in list:
    an axis exists because a capture mentioned it.
  properties:
    name: { type: string }
    position:
      type: integer
      description: Where it reads in a variant's label. Lower comes first.

Account:
  type: object
  required: [id, name, email, isAdmin, createdAt]
  properties:
    id: { type: string }
    name: { type: string }
    email: { type: string, format: email }
    isAdmin:
      type: boolean
      description: Manages accounts and creates projects; reaches no content.
    deactivatedAt:
      type: string
      format: date-time
      description: |
        Absent while the account works. An account is deactivated, never
        deleted: what it reviewed stays readable and the journal keeps naming
        it (ADR 0018).
    createdAt: { type: string, format: date-time }

NewAccount:
  type: object
  required: [name, email]
  properties:
    name: { type: string, minLength: 1 }
    email:
      type: string
      format: email
      description: Unique, and where the sign-in link is sent. There is no password.
    isAdmin:
      type: boolean
      default: false

Rights:
  type: string
  enum: [reader, member]
  description: |
    `reader` sees everything and changes nothing; `member` does everything, on
    the projects they belong to. Two, and no more (`product.md` §8.1).

Membership:
  type: object
  required: [accountId, name, isPerson, rights, addedAt]
  properties:
    accountId: { type: string }
    name: { type: string }
    email:
      type: string
      format: email
      description: Absent for a service account, which has no address to reach.
    isPerson:
      type: boolean
      description: |
        Whether this member is a person or a program. Derived from which kind of
        account holds the membership, never declared
        (`product.md` §8).
    rights:
      $ref: "#/Rights"
    addedAt: { type: string, format: date-time }

NewMembership:
  type: object
  required: [rights]
  properties:
    rights:
      $ref: "#/Rights"
