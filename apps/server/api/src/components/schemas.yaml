Project:
  type: object
  required: [id, slug, name, intakePolicy, createdAt]
  properties:
    id: { type: string }
    slug: { type: string }
    name: { type: string }
    intakePolicy:
      type: string
      enum: [strict, per-case]
      description: |
        `strict` refuses intake while any case is to-review; `per-case` never
        refuses.
    createdAt: { type: string, format: date-time }

NewProject:
  type: object
  required: [slug, name]
  properties:
    slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    name: { type: string, minLength: 1 }
    intakePolicy:
      type: string
      enum: [strict, per-case]
      default: per-case

CaseState:
  type: string
  enum: [not-instrumented, to-review, to-fix, reviewed]
  description: |
    Who holds the ball. Computed by the server from the case's comments; no
    endpoint accepts it as an argument.

Case:
  type: object
  required: [id, projectId, title, state, archived, createdAt, updatedAt]
  properties:
    id:
      type: string
      description: Generated by the server when the case was created. Stable forever.
    projectId: { type: string }
    categoryId: { type: string, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    state:
      $ref: "#/CaseState"
    archived:
      type: boolean
      description: An archived case leaves the catalogue but stays readable.
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

NewCase:
  type: object
  required: [title]
  properties:
    title: { type: string, minLength: 1 }
    description: { type: string }
    categoryId: { type: string }

CaseUpdate:
  type: object
  required: [title]
  properties:
    title: { type: string, minLength: 1 }
    description: { type: string, nullable: true }
    categoryId: { type: string, nullable: true }

Category:
  type: object
  required: [id, name, position]
  properties:
    id: { type: string }
    parentId: { type: string, nullable: true }
    name: { type: string }
    position: { type: integer }

NewCategory:
  type: object
  required: [name]
  properties:
    name: { type: string, minLength: 1 }
    parentId: { type: string }
    position: { type: integer, default: 0 }
