ReviewSave:
  type: object
  properties:
    accepted:
      type: array
      description: The captures the reviewer looked at with nothing to say.
      items:
        $ref: "#/CaptureRef"
    comments:
      type: array
      description: The remarks of this sitting's refusals (ADR 0020).
      items:
        $ref: "#/NewComment"
    unaccepted:
      type: array
      description: |
        Captures whose acceptance the reviewer takes back — a misclick, or a
        second look. The verdict is a toggle until the review ends (#156); the
        journal keeps both moves.
      items:
        $ref: "#/CaptureRef"
    unrefused:
      type: array
      description: |
        Captures whose draft refusal the reviewer takes back: their own remarks
        with no issue attached are withdrawn with it (ADR 0020).
      items:
        $ref: "#/CaptureRef"

CaptureRef:
  type: object
  description: |
    Names one capture by its step and variant — the address a verdict is
    written at, distinct from ADR 0017's *reference* (the approved bytes).
  required: [stepId, variantId]
  properties:
    stepId: { type: string }
    variantId: { type: string }

NewComment:
  type: object
  required: [stepId, body, variantIds]
  properties:
    stepId: { type: string }
    body: { type: string, minLength: 1 }
    variantIds:
      type: array
      minItems: 1
      description: |
        The variants it applies to. One defect spanning four variants is **one**
        comment with four variants checked, never four comments.
      items: { type: string }

ReviewOutcome:
  type: object
  required: [state, comments, verdicts]
  properties:
    state:
      $ref: "./schemas.yaml#/CaseState"
    comments:
      type: integer
      description: How many comments the session added.
    verdicts:
      type: array
      description: The status of every capture the case has, after the save.
      items:
        $ref: "#/CaptureVerdict"

CaptureVerdict:
  allOf:
    - $ref: "#/CaptureRef"
    - type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [to-review, refused, accepted]

IssueRef:
  type: object
  required: [id]
  description: |
    An opaque reference to an issue somewhere else. Supplied by the client and
    never read back: ozalid holds no tracker credential (ADR 0003).
  properties:
    id: { type: string, minLength: 1 }
    url: { type: string, format: uri }
    title:
      type: string
      description: |
        Shown next to the comment. ozalid never refreshes it, so it is whatever
        the client said at the time.

IssueTracking:
  type: object
  required: [id, issueId, state]
  properties:
    id:
      type: string
      description: The ref's own id — what `delivery` and `judgment` name.
    issueId: { type: string }
    url: { type: string, format: uri }
    title:
      type: string
      description: What the book reads once attached; the comment's text was the draft.
    state:
      type: string
      description: accepted, not validated — validated is the vocabulary of captures (#170).
      enum: [tracked, to-review, refused, accepted]
    lastRefusal:
      type: string
      description: The remark of the latest refusal on this ref, if any.

CommentState:
  type: string
  enum: [to-track, tracked, to-review, refused, accepted, discarded]
  description: |
    Where the comment stands. `accepted` and `discarded` are the only terminal
    states; a refusal returns to `to-review` on the next delivery.

Comment:
  type: object
  required: [id, stepId, body, state, variantIds, authorId, createdAt, judgments]
  properties:
    id: { type: string }
    stepId: { type: string }
    body:
      type: string
      description: What the reviewer wrote, in their words. It survives the issue title.
    state:
      $ref: "#/CommentState"
    variantIds:
      type: array
      items: { type: string }
    issue:
      $ref: "#/IssueRef"
      description: The first ref, kept for old readers. The table reads `issues`.
    issues:
      type: array
      description: |
        One row per attached issue, each on its own delivered-and-judged round
        (#138). The comment's own state derives from these.
      items:
        $ref: "#/IssueTracking"
    discardReason:
      type: string
      description: Mandatory when discarded, and kept forever with its author.
    authorId: { type: string }
    createdAt: { type: string, format: date-time }
    judgments:
      type: array
      description: Every judgment, not just the last — three round trips is information.
      items:
        $ref: "#/Judgment"

Judgment:
  type: object
  required: [verdict, actorId, at]
  properties:
    verdict:
      type: string
      description: >-
        taken-back is a reviewer reconsidering an acceptance: unvalidating a
        capture whose validation derived from the settled reference (#167).
      enum: [accepted, refused, taken-back]
    remark:
      type: string
      description: Mandatory on a refusal. It is what the dev has to read.
    actorId: { type: string }
    at: { type: string, format: date-time }

MoveOutcome:
  type: object
  required: [commentState, caseState]
  properties:
    commentState:
      $ref: "#/CommentState"
    caseState:
      $ref: "./schemas.yaml#/CaseState"
