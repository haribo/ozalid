BadRequest:
  description: The request is malformed.
  content:
    application/problem+json:
      schema:
        $ref: "./problem.yaml"

Held:
  description: |
    Somebody else holds this case (ADR 0005, #95): a held case takes no
    verdict but its holder's. The detail names them.
  content:
    application/problem+json:
      schema:
        $ref: "./problem.yaml"

NotFound:
  description: No such resource.
  content:
    application/problem+json:
      schema:
        $ref: "./problem.yaml"

Unauthenticated:
  # No credential, a malformed one, or one nobody knows — all the same answer.
  # Telling them apart would let a caller learn which tokens exist by watching
  # how the server replies.
  description: The caller presented no usable credential.
  content:
    application/problem+json:
      schema:
        $ref: "./problem.yaml"

Forbidden:
  # The caller is somebody, and that somebody may not do this. Distinct from
  # Unauthenticated on purpose: one is fixed by presenting a credential, the
  # other by being granted something, and a client that cannot tell them apart
  # retries forever.
  description: The caller is known and not allowed to do this.
  content:
    application/problem+json:
      schema:
        $ref: "./problem.yaml"
