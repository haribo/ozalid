parameters:
  - name: slug
    in: path
    required: true
    schema: { type: string }
  - name: serviceAccountId
    in: path
    required: true
    schema: { type: string }
  - name: tokenId
    in: path
    required: true
    schema: { type: string }

delete:
  operationId: retireServiceToken
  security:
    - serviceToken: []
    - session: []
  summary: Stop one token working
  description: |
    The account keeps its other tokens. This is the second half of a rotation,
    and the half that is easy to forget — a token nobody retires is a
    credential nobody is watching.

    Idempotent: retiring one that is already gone changes nothing.
  tags: [accounts]
  responses:
    "204":
      description: That token opens nothing.
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
