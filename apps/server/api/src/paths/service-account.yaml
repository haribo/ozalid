parameters:
  - name: slug
    in: path
    required: true
    schema: { type: string }
  - name: serviceAccountId
    in: path
    required: true
    schema: { type: string }

delete:
  operationId: deactivateServiceAccount
  security:
    - serviceToken: []
    - session: []
  summary: Retire a program
  description: |
    Deactivated, never deleted: the journal names it, and evidence has to
    survive the account that produced it
    ([ADR 0018](https://github.com/haribo/ozalid/blob/develop/docs/adr/0018-an-actor-is-never-invented.md)).
    Its tokens stop opening anything at once.

    Idempotent: retiring one already retired changes nothing.
  tags: [accounts]
  responses:
    "204":
      description: It reaches nothing any more.
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
