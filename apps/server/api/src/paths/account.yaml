parameters:
  - name: accountId
    in: path
    required: true
    schema: { type: string }

patch:
  operationId: setAccountRole
  security:
    - serviceToken: []
    - session: []
  summary: Promote or demote an account
  description: |
    An ordinary administrative act, and the reason a role set wrongly when the
    account was made is not permanent.

    **The last administrator cannot be demoted.** An instance with nobody
    administering it can no longer make an account, grant a membership or mint a
    token, and nothing short of a database console repairs that.
  tags: [accounts]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [isAdmin]
          properties:
            isAdmin: { type: boolean }
  responses:
    "204":
      description: The role is what was asked for.
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
    "409":
      description: It would leave the instance with no administrator.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml"

delete:
  operationId: deactivateAccount
  security:
    - serviceToken: []
    - session: []
  summary: Stop an account from signing in
  description: |
    Deactivated, never deleted. Every fact it recorded keeps naming it, and the
    journal holds no foreign key to the account table precisely so evidence
    outlives the person ([ADR 0018](https://github.com/haribo/ozalid/blob/develop/docs/adr/0018-an-actor-is-never-invented.md)).

    Idempotent: deactivating an account that is already deactivated changes
    nothing and answers the same.
  tags: [accounts]
  responses:
    "204":
      description: The account can no longer sign in.
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
    "409":
      description: It would leave the instance with no administrator.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml"
