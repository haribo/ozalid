get:
  operationId: listProjects
  security:
    - serviceToken: []
    - session: []
  summary: The projects this caller may see
  description: |
    The ones they belong to — and every one on the instance when they administer
    it. An administrator names a project to manage its membership, and a power
    that cannot be exercised is not a power (`product.md` §8.2). What stays
    withheld is everything inside: the cases, the captures, the remarks.

    A service account belongs to one project and sees that one
    ([ADR 0018](https://github.com/haribo/ozalid/blob/develop/docs/adr/0018-an-actor-is-never-invented.md)).
  tags: [catalogue]
  responses:
    "200":
      description: The projects, by name.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/Project"
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"

post:
  operationId: createProject
  security:
    - serviceToken: []
    - session: []
  summary: Open a book
  tags: [projects]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/NewProject"
  responses:
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    "201":
      description: The project is open.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/Project"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "409":
      description: That slug is taken.
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml"
