parameters:
  - name: slug
    in: path
    required: true
    schema: { type: string }

post:
  operationId: createServiceAccount
  security:
    - serviceToken: []
    - session: []
  summary: Make a program an account on this project
  description: |
    A service account belongs to exactly one project, and that is enforced by a
    partial unique index rather than trusted
    ([ADR 0018](https://github.com/haribo/ozalid/blob/develop/docs/adr/0018-an-actor-is-never-invented.md)).
    It is created here, with the project, and never moves.

    **Administration, not membership.** Creating one is granting a membership,
    and an administrator grants memberships (`product.md` §8.2). A member of the
    project could otherwise mint a credential that keeps working after their own
    membership is revoked — a program nobody remembers, holding rights nobody
    reviews.

    The token comes back in the response and nowhere else.
  tags: [accounts]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/NewServiceAccount"
  responses:
    "201":
      description: The account, and its first token — once.
      content:
        application/json:
          schema:
            type: object
            required: [account, token]
            properties:
              account:
                $ref: "../components/schemas.yaml#/ServiceAccount"
              token:
                $ref: "../components/schemas.yaml#/MintedToken"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthenticated"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
